# Canon config-cursor: merged into ~/.jcode/config.toml by install-jcode.sh.

[keybindings]

[features]
mermaid = false
persist_memory_injections = true
kv_cache_miss_notices = false

[hooks]
pre_tool = "~/.jcode/hooks/garde-fou-jcode.py"

[provider]
cross_provider_failover = "manual"
same_provider_account_failover = false

[notifications]
turn_complete = false

[compaction]
mode = "semantic"

[launch_hotkeys]
enabled = false